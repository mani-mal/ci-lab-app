name: pytest

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Check runner disk
        run: |
          echo "runner: $RUNNER_NAME"
          echo "No space left on device"
          exit 1
      - name: Run tests
        run: pytest test/ -v
